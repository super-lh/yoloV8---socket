# ============================================================
# 插座检测数据集配置
# ============================================================
# 2026-10-18 合并更新：dataset 已并入小样本增强数据，共 206 张
# 2026-10-18 重划分（按源图分组，杜绝泄漏）：
#   train 175 张 = 原图 9 + 变换增强 72(aug_) + 背景合成 90(cp_) + 背景 4，266 个框
#   val   31 张 = 原图 6 + 变换增强 24 + 背景 1，33 个框（val 占比 15%）
#   原则：同一源图与其 aug 变体同进同出；cp 合成图只留 train（其插座块来自 train 正样本）
#   增强脚本：D:\WorkBuddy产物\插座数据增强\work\augment.py
#   原 dataset_aug 已备份至 D:\WorkBuddy产物\插座数据增强\dataset_aug_备份
# 检测目标：插座（墙面插座）
#
# 如果需要同时区分多种目标，改成多类别，例如：
#   names:
#     0: socket        墙面插座
#     1: power_strip   排插/拖线板
#     2: switch        墙壁开关
# 注意：类别序号必须与标注文件(.txt)里的 class_id 一致，
#       改动类别后需要重新标注或转换已有标注。
# ============================================================

# 数据集根目录（2026-10-18 修正：原路径 D:/YOLOv8/dataset 不存在，已改为实际目录）
path: D:/super-lhyolov8socket/yoloV8---socket/dataset

# 相对 path 的子目录
train: images/train
val: images/val

# 类别定义（单类别：插座）
names:
  0: socket


# ============================================================
# 目录结构（已为你创建好空目录，把图片和标注放进去即可）
# ============================================================
# D:/YOLOv8/dataset/
# ├── images/
# │   ├── train/   ← 训练图片放这里
# │   └── val/     ← 验证图片放这里
# └── labels/
#     ├── train/   ← 训练标注放这里（与图片同名 .txt）
#     └── val/     ← 验证标注放这里
#
# ============================================================
# 标注格式
# ============================================================
# 每行一个插座：0  x_center  y_center  width  height
# 后四项为相对整图的比例(0~1)
# 示例：0  0.412000  0.638000  0.153000  0.187000
#
# ============================================================
# 采集建议（针对插座场景）
# ============================================================
# 数量：起步 200~300 张，可用效果 500 张以上
# 类型：五孔、三孔、带开关插座、不同品牌款式
# 角度：正面为主，补充斜 45 度、俯视、侧视
# 距离：近景(占画面 1/2) + 中景(占 1/4) + 远景(占 1/8 以下)
# 光线：白天自然光、夜间灯光、逆光、阴影
# 背景：白墙、瓷砖、木质、带家具杂物（提高鲁棒性）
# 干扰项：务必包含墙壁开关面板作为负样本，避免误检
# 划分：train 与 val 约 8:2，且 val 场景不要与 train 重复
